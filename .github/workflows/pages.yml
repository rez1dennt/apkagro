name: Publish website design to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install runtime dependencies
        run: npm ci
      - name: Test preview build
        run: node --test tests/frontend-pages.mjs
      - name: Build public website
        run: node scripts/build-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/github-pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
