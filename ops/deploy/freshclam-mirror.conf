# Merge into /etc/clamav/freshclam.conf, replacing existing mirror/update entries.
# Use DatabaseMirror, not PrivateMirror: only digitally verified CVD downloads.
DatabaseMirror https://mirror.truenetwork.ru/clamav
DNSDatabaseInfo no
ScriptedUpdates no
TestDatabases yes
Bytecode yes
Checks 12
NotifyClamd /etc/clamav/clamd.conf
