server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn----8sbegcgafin8chbjtk.xn--p1ai;
    # Node URL parsing treats raw backslashes as slashes. Reject both spellings
    # before the exact intake location so the temporary QA gate cannot be skipped.
    if ($uri ~ "\\\\") { return 400; }
    ssl_certificate /etc/letsencrypt/live/apkagro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apkagro/privkey.pem;
    include /etc/nginx/snippets/apkagro-tls.conf;
    client_max_body_size 84m;
    client_body_timeout 65s;
    send_timeout 100s;
    # Avoid recording query strings or request bodies (personal data / tokens).
    access_log /var/log/nginx/apkagro-access.log apkagro_safe;
    error_log /var/log/nginx/apkagro-error.log warn;
    location = /api/applications {
        # During first-release QA: allow loopback only. After acceptance keep a
        # nonempty comment in the gate file; backup verifies it as runtime config.
        include /etc/apkagro/intake-gate.conf;
        include /etc/nginx/snippets/apkagro-proxy.conf;
    }
    location / { include /etc/nginx/snippets/apkagro-proxy.conf; }
}
